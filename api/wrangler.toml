name = "find-a-flat"
main = "src/index.js"
compatibility_date = "2026-11-01"

# The Flutter web build. `/` and `/api/*` run the Worker first; any other
# path is a static file, or index.html so Flutter can route /home itself.
[assets]
directory = "../app/build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/api/*"]

# The Deploy workflow fills in the real database_id: it finds (or creates)
# the D1 database named below in the Cloudflare account.
# "local" is enough for `wrangler dev` and the Check workflow.
[[d1_databases]]
binding = "DB"
database_name = "find-a-flat"
database_id = "local"
migrations_dir = "migrations"
